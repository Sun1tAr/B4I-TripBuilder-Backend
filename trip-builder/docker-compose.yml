version: '3.8'

services:

  docker-logger:
    image: umputun/docker-logger:latest
    container_name: docker-logger
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-logs:/srv/logs
    environment:
      - LOG_FILES=true
      - MAX_SIZE=50
      - MAX_FILES=5
      - TIME_ZONE=Europe/Moscow
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trip-builder} # fixme
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_${CONTOUR:-local}:/var/lib/postgresql/data
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trip-builder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
#      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    networks:
      - trip-builder-network
    restart: unless-stopped
#    deploy:
#      resources:
#        limits:
#          memory: 256M
#        reservations:
#          memory: 128M

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT:-2181}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Память
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+DisableExplicitGC"

      # Логи (WARN)
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,state.change.logger=WARN,kafka.log.LogManager=WARN,kafka=WARN"

      # Топики и партиции
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Ретеншн
      KAFKA_OFFSETS_RETENTION_MINUTES: 60
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_MS: 86400000
    networks:
      - trip-builder-network
    restart: unless-stopped

  auth:
    build:
      context: services/auth/
      dockerfile: Dockerfile
    image: ${AUTH_IMAGE:-trip-builder-auth:local}
    container_name: trip-builder-backend-auth
    env_file:
      - services/auth/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user:
    build:
      context: services/user/
      dockerfile: Dockerfile
    image: ${USER_IMAGE:-trip-builder-user:local}
    container_name: trip-builder-backend-user
    env_file:
      - services/user/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: services/gateway/
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-trip-builder-gateway:local}
    container_name: trip-builder-backend-gateway
    env_file:
      - services/gateway/.env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
      - "${GATEWAY_WS_PORT:-8091}:8091"
    networks:
      - trip-builder-network
    restart: unless-stopped
    depends_on:
      - auth
      - user

  route:
    build:
      context: services/route/
      dockerfile: Dockerfile
    image: ${ROUTE_IMAGE:-trip-builder-route:local}
    container_name: trip-builder-backend-route
    env_file:
      - services/route/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  event:
    build:
      context: services/event/
      dockerfile: Dockerfile
    image: ${EVENT_IMAGE:-trip-builder-event:local}
    container_name: trip-builder-backend-event
    env_file:
      - services/event/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  task:
    build:
      context: services/task/
      dockerfile: Dockerfile
    image: ${TASK_IMAGE:-trip-builder-task:local}
    container_name: trip-builder-backend-task
    env_file:
      - services/task/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  chat:
    build:
      context: services/chat/
      dockerfile: Dockerfile
    image: ${CHAT_IMAGE:-trip-builder-chat:local}
    container_name: trip-builder-backend-chat
    env_file:
      - services/chat/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  media:
    build:
      context: services/media/
      dockerfile: Dockerfile
    image: ${MEDIA_IMAGE:-trip-builder-media:local}
    container_name: trip-builder-backend-media
    env_file:
      - services/media/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_${CONTOUR:-local}:/data # fixme
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  notification:
    build:
      context: services/notification/
      dockerfile: Dockerfile
    image: ${NOTIFICATION_IMAGE:-trip-builder-notification:local}
    container_name: trip-builder-backend-notification
    env_file:
      - services/notification/.env
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # Добавляем MailHog для тестирования email в dev окружении
#  mailhog:
#    image: mailhog/mailhog:latest
#    container_name: ${MAILHOG_CONTAINER_NAME:-trip-builder-backend-mailhog}
#    ports:
#      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP порт
#      - "${MAILHOG_WEB_PORT:-8025}:8025"   # Веб-интерфейс
#    networks:
#      - trip-builder-network
#    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090" # fixme
    networks:
      - trip-builder-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - trip-builder-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - trip-builder-network
    restart: unless-stopped

networks:
  trip-builder-network:
    driver: bridge

volumes:
  postgres_data_local: # fixme
    driver: local
  minio_data_local:  # fixme
    driver: local
  prometheus_data:
    driver: local