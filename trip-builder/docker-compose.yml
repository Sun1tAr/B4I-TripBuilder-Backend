version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-trip-builder-backend-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trip-builder}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_${CONTOUR:-local}:/var/lib/postgresql/data
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trip-builder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-trip-builder-backend-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: ${ZOOKEEPER_CONTAINER_NAME:-trip-builder-backend-zookeeper}
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - trip-builder-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ${KAFKA_CONTAINER_NAME:-trip-builder-backend-kafka}
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT:-2181}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_CONTAINER_NAME:-trip-builder-backend-kafka}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  auth:
    build:
      context: services/auth/
      dockerfile: Dockerfile
    image: ${AUTH_IMAGE:-trip-builder-auth:local}
    container_name: ${AUTH_CONTAINER_NAME:-trip-builder-backend-auth}
    env_file:
      - services/auth/.env
    ports:
      - "${AUTH_PORT:-8081}:8081"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user:
    build:
      context: services/user/
      dockerfile: Dockerfile
    image: ${USER_IMAGE:-trip-builder-user:local}
    container_name: ${USER_CONTAINER_NAME:-trip-builder-backend-user}
    env_file:
      - services/user/.env
    ports:
      - "${USER_PORT:-8082}:8082"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: services/gateway/
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-trip-builder-gateway:local}
    container_name: ${GATEWAY_CONTAINER_NAME:-trip-builder-backend-gateway}
    env_file:
      - services/gateway/.env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
      - "${GATEWAY_WS_PORT:-8091}:8091"
    networks:
      - trip-builder-network
    restart: unless-stopped
    depends_on:
      - auth
      - user

  route:
    build:
      context: services/route/
      dockerfile: Dockerfile
    image: ${ROUTE_IMAGE:-trip-builder-route:local}
    container_name: ${ROUTE_CONTAINER_NAME:-trip-builder-backend-route}
    env_file:
      - services/route/.env
    ports:
      - "${ROUTE_PORT:-8083}:8083"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  event:
    build:
      context: services/event/
      dockerfile: Dockerfile
    image: ${EVENT_IMAGE:-trip-builder-event:local}
    container_name: ${EVENT_CONTAINER_NAME:-trip-builder-backend-event}
    env_file:
      - services/event/.env
    ports:
      - "${EVENT_PORT:-8084}:8084"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  task:
    build:
      context: services/task/
      dockerfile: Dockerfile
    image: ${TASK_IMAGE:-trip-builder-task:local}
    container_name: ${TASK_CONTAINER_NAME:-trip-builder-backend-task}
    env_file:
      - services/task/.env
    ports:
      - "${TASK_PORT:-8085}:8085"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  chat:
    build:
      context: services/chat/
      dockerfile: Dockerfile
    image: ${CHAT_IMAGE:-trip-builder-chat:local}
    container_name: ${CHAT_CONTAINER_NAME:-trip-builder-backend-chat}
    env_file:
      - services/chat/.env
    ports:
      - "${CHAT_PORT:-8086}:8086"
      - "${CHAT_WS_PORT:-8088}:8088"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  media:
    build:
      context: services/media/
      dockerfile: Dockerfile
    image: ${MEDIA_IMAGE:-trip-builder-media:local}
    container_name: ${MEDIA_CONTAINER_NAME:-trip-builder-backend-media}
    env_file:
      - services/media/.env
    ports:
      - "${MEDIA_PORT:-8087}:8087"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ${MINIO_CONTAINER_NAME:-trip-builder-backend-minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_${CONTOUR:-local}:/data
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

networks:
  trip-builder-network:
    driver: bridge

volumes:
  postgres_data_local:
    driver: local
  postgres_data_development:
    driver: local
  postgres_data_production:
    driver: local
  minio_data_local:
    driver: local
  minio_data_development:
    driver: local
  minio_data_production:
    driver: local