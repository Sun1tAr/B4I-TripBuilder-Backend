version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-trip-builder-backend-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trip-builder}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/auth/migrations:/docker-entrypoint-initdb.d
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trip-builder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build:
      context: services/auth/
      dockerfile: Dockerfile
    image: ${AUTH_IMAGE:-trip-builder-auth:local}
    container_name: ${AUTH_CONTAINER_NAME:-trip-builder-backend-auth}
    env_file:
      - services/auth/.env
    ports:
      - "${AUTH_PORT:-8081}:8081"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  user:
    build:
      context: services/user/
      dockerfile: Dockerfile
    image: ${USER_IMAGE:-trip-builder-user:local}
    container_name: ${USER_CONTAINER_NAME:-trip-builder-backend-user}
    env_file:
      - services/user/.env
    ports:
      - "${USER_PORT:-8082}:8082"
    networks:
      - trip-builder-network
    restart: unless-stopped

  gateway:
    build:
      context: services/gateway/
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-trip-builder-gateway:local}
    container_name: ${GATEWAY_CONTAINER_NAME:-trip-builder-backend-gateway}
    env_file:
      - services/gateway/.env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    networks:
      - trip-builder-network
    restart: unless-stopped
    depends_on:
      - auth
      - user

networks:
  trip-builder-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local