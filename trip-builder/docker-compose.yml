version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-trip-builder-backend-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trip-builder}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/auth/migrations/001_create_auth_tables.sql:/docker-entrypoint-initdb.d/001_create_auth_tables.sql
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trip-builder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-trip-builder-backend-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: ${ZOOKEEPER_CONTAINER_NAME:-trip-builder-backend-zookeeper}
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - trip-builder-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ${KAFKA_CONTAINER_NAME:-trip-builder-backend-kafka}
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT:-2181}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    networks:
      - trip-builder-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:${KAFKA_PORT:-9092}", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  auth:
    build:
      context: services/auth/
      dockerfile: Dockerfile
    image: ${AUTH_IMAGE:-trip-builder-auth:local}
    container_name: ${AUTH_CONTAINER_NAME:-trip-builder-backend-auth}
    env_file:
      - services/auth/.env
    ports:
      - "${AUTH_PORT:-8081}:8081"
    networks:
      - trip-builder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user:
    build:
      context: services/user/
      dockerfile: Dockerfile
    image: ${USER_IMAGE:-trip-builder-user:local}
    container_name: ${USER_CONTAINER_NAME:-trip-builder-backend-user}
    env_file:
      - services/user/.env
    ports:
      - "${USER_PORT:-8082}:8082"
    networks:
      - trip-builder-network
    restart: unless-stopped

  gateway:
    build:
      context: services/gateway/
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-trip-builder-gateway:local}
    container_name: ${GATEWAY_CONTAINER_NAME:-trip-builder-backend-gateway}
    env_file:
      - services/gateway/.env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    networks:
      - trip-builder-network
    restart: unless-stopped
    depends_on:
      - auth
      - user

networks:
  trip-builder-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local