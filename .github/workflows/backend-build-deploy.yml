name: Backend Build and Deploy (Reusable)

on:
  workflow_call:
    inputs:
      contour:
        description: 'Environment contour (development/production)'
        required: true
        type: string
      deploy_path:
        description: 'Deployment path on server'
        required: true
        type: string
      nginx_conf_source:
        description: 'Path to nginx config file in repo'
        required: true
        type: string
      nginx_conf_target:
        description: 'Target path for nginx config on server'
        required: true
        type: string
      services:
        description: 'JSON array of service names'
        required: true
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      # GITHUB_TOKEN УБРАН - он доступен автоматически

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  CONTOUR: ${{ inputs.contour }}
  DEPLOY_PATH: ${{ inputs.deploy_path }}
  NGINX_APPS_AVAILABLE: ${{ inputs.nginx_conf_target }}
  NGINX_APPS_ENABLED: /etc/nginx/apps-enabled/$(basename ${{ inputs.nginx_conf_target }})

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: read

    strategy:
      matrix:
        service: ${{ fromJson(inputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare ${{ matrix.service }} vendor
        working-directory: ./trip-builder/services/${{ matrix.service }}
        run: |
          go mod download
          go mod vendor
          go test ./... -v || true

      - name: Upload ${{ matrix.service }} vendor
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-vendor
          path: trip-builder/services/${{ matrix.service }}/vendor/
          retention-days: 1

  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: ${{ fromJson(inputs.services) }}

    steps:
      - name: Set lowercase variables
        id: string
        run: |
          echo "lowercase_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          echo "lowercase_repo=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ${{ matrix.service }} vendor
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-vendor
          path: trip-builder/services/${{ matrix.service }}/vendor/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # ← используется напрямую

      - name: Build and push ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-builder/services/${{ matrix.service }}
          file: ./trip-builder/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/${{ matrix.service }}:${{ inputs.contour }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set lowercase variables
        id: string
        run: |
          echo "lowercase_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          echo "lowercase_repo=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directories on server
        run: |
          for service in $(echo '${{ inputs.services }}' | jq -r '.[]'); do
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}/services/$service"
          done

      - name: Copy docker-compose.yml to server
        run: |
          scp trip-builder/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml

      - name: Copy env files to server
        run: |
          for service in $(echo '${{ inputs.services }}' | jq -r '.[]'); do
            scp trip-builder/services/$service/.env.${{ inputs.contour }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/services/$service/.env
          done

      - name: Create docker-compose .env file on server
        run: |
          # Собираем переменные для всех сервисов
          ENV_CONTENT="CONTOUR=${{ inputs.contour }}\n"
          
          for service in $(echo '${{ inputs.services }}' | jq -r '.[]'); do
            SERVICE_UPPER=$(echo "$service" | tr '[:lower:]' '[:upper:]')
          
            # Получаем значения из env (они должны быть определены в вызывающем workflow)
            PORT_VAR="${SERVICE_UPPER}_PORT"
            CONTAINER_VAR="${SERVICE_UPPER}_CONTAINER_NAME"
          
            # Добавляем в .env файл
            ENV_CONTENT="${ENV_CONTENT}${PORT_VAR}=${!PORT_VAR}\n"
            ENV_CONTENT="${ENV_CONTENT}${CONTAINER_VAR}=${!CONTAINER_VAR}\n"
            ENV_CONTENT="${ENV_CONTENT}${SERVICE_UPPER}_IMAGE=${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/$service:${{ github.sha }}\n"
          done
          
          echo -e "$ENV_CONTENT" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat > ${{ env.DEPLOY_PATH }}/.env"

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker-compose pull

            # Stop and remove old containers
            docker-compose down --remove-orphans || true

            # Start new containers WITHOUT BUILD
            docker-compose up -d --no-build

            docker image prune -f
          EOF

  configure-nginx:
    name: Configure Nginx
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.pull_request.merged == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy nginx config to server
        run: |
          scp ${{ inputs.nginx_conf_source }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.NGINX_APPS_AVAILABLE }}

      - name: Enable nginx config and reload
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
          
            sudo ln -sf ${{ env.NGINX_APPS_AVAILABLE }} ${{ env.NGINX_APPS_ENABLED }}
            sudo nginx -t && sudo systemctl reload nginx
          EOF