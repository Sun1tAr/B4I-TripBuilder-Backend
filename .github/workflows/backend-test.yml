name: Backend Test CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - release

permissions:
  contents: read
  packages: write

env:
  # Auth service
  AUTH_PORT: 9001
  AUTH_CONTAINER_NAME: trip-builder-backend-auth-test

  # User service
  USER_PORT: 9002
  USER_CONTAINER_NAME: trip-builder-backend-user-test

  # Gateway service
  GATEWAY_PORT: 9010
  GATEWAY_CONTAINER_NAME: trip-builder-backend-gateway-test

jobs:
  call-build-deploy:
    uses: ./.github/workflows/backend-build-deploy.yml
    with:
      contour: production
      deploy_path: /opt/trip-builder/test
      nginx_conf_source: .docker/nginx-backend-test.conf
      nginx_conf_target: /etc/nginx/apps-available/trip-builder-backend-test.conf
      services: '["auth", "user", "gateway"]'
      # Передаём порты и имена контейнеров
      auth_port: ${{ env.AUTH_PORT }}
      auth_container_name: ${{ env.AUTH_CONTAINER_NAME }}
      user_port: ${{ env.USER_PORT }}
      user_container_name: ${{ env.USER_CONTAINER_NAME }}
      gateway_port: ${{ env.GATEWAY_PORT }}
      gateway_container_name: ${{ env.GATEWAY_CONTAINER_NAME }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}