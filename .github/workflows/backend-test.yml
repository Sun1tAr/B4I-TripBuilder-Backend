name: Backend Test CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - release

permissions:
  contents: read
  packages: write


jobs:
  # Сначала вычисляем время
  prepare:
    name: Prepare workflow data
    runs-on: ubuntu-latest
    outputs:
      workflow_start: ${{ steps.time.outputs.workflow_start }}
    steps:
      - name: Get workflow start time
        id: time
        run: |
          WORKFLOW_START=$(date -u +'%Y.%m.%d.%H.%M')
          echo "workflow_start=$WORKFLOW_START" >> $GITHUB_OUTPUT
          echo "Workflow started at: $WORKFLOW_START"

  call-build-deploy:
    needs: prepare
    uses: ./.github/workflows/backend-build-deploy.yml
    with:
      contour: production
      deploy_path: /opt/trip-builder/test
      nginx_conf_source: .docker/nginx-backend-test.conf
      nginx_conf_target: /etc/nginx/apps-available/trip-builder-backend-test.conf

      # Передаём вычисленное время
      workflow_start: ${{ needs.prepare.outputs.workflow_start || 'default_value'  }}

      services: '["auth", "user", "gateway"]'

      auth_port: 9001
      auth_container_name: trip-builder-backend-auth-test

      user_port: 9002
      user_container_name: trip-builder-backend-user-test

      gateway_port: 9010
      gateway_container_name: trip-builder-backend-gateway-test

      postgres_port: 5432
      postgres_container_name: postgres-test
      postgres_user: auth_user
      postgres_password: auth_pass_test
      postgres_database_name: trip-builder

      redis_port: 6379
      redis_container_name: redis-test

      zookeeper_container_name: zookeeper-test
      zookeeper_port: 2181
      kafka_container_name: kafka-test
      kafka_port: 9092
      kafka_topics: '["user.created", "user.updated", "user.deleted", "route.created", "event.completed", "media.uploaded", "user.events.retry", "user.events.dlq", "user.achievement_earned"]'

    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}