name: Backend Test CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - release

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  DEPLOY_PATH: /opt/trip-builder/test
  NGINX_APPS_AVAILABLE: /etc/nginx/apps-available/trip-builder-backend-test.conf
  NGINX_APPS_ENABLED: /etc/nginx/apps-enabled/trip-builder-backend-test.conf
  CONTOUR: production

  # Auth service
  AUTH_PORT: 9001
  AUTH_CONTAINER_NAME: trip-builder-backend-auth-test

  # User service
  USER_PORT: 9002
  USER_CONTAINER_NAME: trip-builder-backend-user-test

  # Gateway service
  GATEWAY_PORT: 9010
  GATEWAY_CONTAINER_NAME: trip-builder-backend-gateway-test

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Auth service
      - name: Prepare Auth vendor
        working-directory: ./trip-builder/services/auth
        run: |
          go mod download
          go mod vendor
          go test ./... -v || true

      - name: Upload Auth vendor
        uses: actions/upload-artifact@v4
        with:
          name: auth-vendor
          path: trip-builder/services/auth/vendor/
          retention-days: 1

      # User service
      - name: Prepare User vendor
        working-directory: ./trip-builder/services/user
        run: |
          go mod download
          go mod vendor
          go test ./... -v || true

      - name: Upload User vendor
        uses: actions/upload-artifact@v4
        with:
          name: user-vendor
          path: trip-builder/services/user/vendor/
          retention-days: 1

      # Gateway service
      - name: Prepare Gateway vendor
        working-directory: ./trip-builder/services/gateway
        run: |
          go mod download
          go mod vendor
          go test ./... -v || true

      - name: Upload Gateway vendor
        uses: actions/upload-artifact@v4
        with:
          name: gateway-vendor
          path: trip-builder/services/gateway/vendor/
          retention-days: 1

  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase variables
        id: string
        run: |
          echo "lowercase_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          echo "lowercase_repo=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      # Auth service
      - name: Download Auth vendor
        uses: actions/download-artifact@v4
        with:
          name: auth-vendor
          path: trip-builder/services/auth/vendor/

      # User service
      - name: Download User vendor
        uses: actions/download-artifact@v4
        with:
          name: user-vendor
          path: trip-builder/services/user/vendor/

      # Gateway service
      - name: Download Gateway vendor
        uses: actions/download-artifact@v4
        with:
          name: gateway-vendor
          path: trip-builder/services/gateway/vendor/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Auth service
      - name: Build and push Auth Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-builder/services/auth
          file: ./trip-builder/services/auth/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/auth:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/auth:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # User service
      - name: Build and push User Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-builder/services/user
          file: ./trip-builder/services/user/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/user:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/user:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gateway service
      - name: Build and push Gateway Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-builder/services/gateway
          file: ./trip-builder/services/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/gateway:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/gateway:test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set lowercase variables
        id: string
        run: |
          echo "lowercase_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          echo "lowercase_repo=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directories on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}/services/auth ${{ env.DEPLOY_PATH }}/services/user"

      - name: Copy docker-compose.yml to server
        run: |
          scp trip-builder/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml

      # Копируем .env файлы для каждого сервиса
      # Auth service
      # User service
      # Gateway service
      - name: Copy env files to server
        run: |
          scp trip-builder/services/auth/.env.${{ env.CONTOUR }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/services/auth/.env
          scp trip-builder/services/user/.env.${{ env.CONTOUR }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/services/user/.env
          scp trip-builder/services/gateway/.env.${{ env.CONTOUR }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/services/gateway/.env

        # Создаем .env файл для docker-compose с образами из GHCR и портами тest
        # Auth service
        # User service
        # Gateway service
        - name: Create docker-compose .env file on server
          run: |
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat > ${{ env.DEPLOY_PATH }}/.env << 'EOF'
            CONTOUR=${{ env.CONTOUR }}
            AUTH_PORT=${{ env.AUTH_PORT }}
            AUTH_CONTAINER_NAME=${{ env.AUTH_CONTAINER_NAME }}
            AUTH_IMAGE=${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/auth:${{ github.sha }}
            USER_PORT=${{ env.USER_PORT }}
            USER_CONTAINER_NAME=${{ env.USER_CONTAINER_NAME }}
            USER_IMAGE=${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/user:${{ github.sha }}
            GATEWAY_PORT=${{ env.GATEWAY_PORT }}
            GATEWAY_CONTAINER_NAME=${{ env.GATEWAY_CONTAINER_NAME }}
            GATEWAY_IMAGE=${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/gateway:${{ github.sha }}
            EOF"

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker-compose pull

            # Stop and remove old containers
            docker-compose down --remove-orphans || true

            # Start new containers WITHOUT BUILD (использует готовые образы из .env)
            docker-compose up -d --no-build

            docker image prune -f
          EOF

  configure-nginx:
    name: Configure Nginx
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.event.pull_request.merged == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy nginx config to server
        run: |
          scp .docker/nginx-backend-test.conf ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.NGINX_APPS_AVAILABLE }}

      - name: Enable nginx config and reload
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
          
            sudo ln -sf ${{ env.NGINX_APPS_AVAILABLE }} ${{ env.NGINX_APPS_ENABLED }}
            sudo nginx -t && sudo systemctl reload nginx
          EOF