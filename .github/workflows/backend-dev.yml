name: Deploy Backend (Dev)

on:
  pull_request:
    types: [closed]
    branches:
      - develop

env:
  CONTOUR: development
  COMPOSE_PROJECT_NAME: tripbuilder-dev
  REMOTE_PATH: /opt/trip-builder/dev
  NGINX_CONF_SOURCE: .docker/nginx-backend-dev.conf
  NGINX_CONF_TARGET: /etc/nginx/apps-available/trip-builder-backend-dev.conf

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env files and vendor for each service
        run: |
          cd trip-builder/services
          # Только реальные сервисы с кодом
          for service in auth user; do
            echo "Processing $service"
            cd $service
            if [ -f ".env.${{ env.CONTOUR }}" ]; then
              cp ".env.${{ env.CONTOUR }}" .env
            fi
            go mod vendor
            cd ..
          done

      - name: Build and save Docker images
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGES_DIR="${{ github.workspace }}/images"
          mkdir -p "$IMAGES_DIR"
          BUILT_SERVICES=""
          
          cd trip-builder/services
          # Только сервисы с Dockerfile
          for service in auth user; do
            if [ -f "$service/Dockerfile" ]; then
              echo "Building $service..."
              cd $service
          
              docker build \
                -t ${REPO_LOWER}/$service:${{ github.sha }} \
                -f Dockerfile \
                .
          
              if [ $? -eq 0 ]; then
                echo "Saving $service..."
                docker save ${REPO_LOWER}/$service:${{ github.sha }} | gzip > "$IMAGES_DIR/$service.tar.gz"
                BUILT_SERVICES="$BUILT_SERVICES $service"
              else
                echo "❌ Failed to build $service"
                exit 1
              fi
              cd ..
            fi
          done
          
          echo "BUILT_SERVICES=$BUILT_SERVICES" >> $GITHUB_ENV
          ls -la "$IMAGES_DIR"

      - name: Copy nginx config and service dirs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            .docker/nginx-backend-dev.conf
            trip-builder/services/auth/
            trip-builder/services/user/
          target: /tmp
          strip_components: 0

      - name: Copy images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images/*.tar.gz"
          target: "/tmp"

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Создаём рабочую директорию
            sudo mkdir -p ${{ env.REMOTE_PATH }}
            sudo chown $USER:$USER ${{ env.REMOTE_PATH }}

            # Копируем папки сервисов
            cp -r /tmp/trip-builder/services/auth ${{ env.REMOTE_PATH }}/
            cp -r /tmp/trip-builder/services/user ${{ env.REMOTE_PATH }}/

            # Копируем docker-compose.yml
            cp /tmp/trip-builder/docker-compose.yml ${{ env.REMOTE_PATH }}/ 2>/dev/null || echo "No docker-compose.yml"

            # Устанавливаем nginx конфиг
            sudo mv /tmp/.docker/nginx-backend-dev.conf ${{ env.NGINX_CONF_TARGET }}
            sudo ln -sf ${{ env.NGINX_CONF_TARGET }} /etc/nginx/apps-enabled/$(basename ${{ env.NGINX_CONF_TARGET }})

            # Загружаем образы
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            cd /tmp/images
            for img in *.tar.gz; do
              echo "Loading $img..."
              gunzip -c "$img" | docker load
            done
            rm -rf /tmp/images

            # Перезагружаем nginx
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Deployed services:${{ env.BUILT_SERVICES }}"