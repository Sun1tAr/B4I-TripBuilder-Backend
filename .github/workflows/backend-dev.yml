name: Deploy Backend (Dev)

on:
  pull_request:
    types: [closed]
    branches:
      - develop

env:
  CONTOUR: development
  COMPOSE_PROJECT_NAME: tripbuilder-dev
  REMOTE_PATH: /opt/trip-builder/dev
  NGINX_CONF_SOURCE: .docker/nginx-backend-dev.conf
  NGINX_CONF_TARGET: /etc/nginx/apps-available/trip-builder-backend-dev.conf

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get list of services
        id: services
        run: |
          cd trip-builder/services
          SERVICES=$(ls -d */ | sed 's#/##' | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

      - name: Prepare env files and vendor for each service
        run: |
          cd trip-builder/services
          for service in $(echo '${{ steps.services.outputs.services }}' | jq -r '.[]'); do
            echo "Processing $service"
            cd $service
            if [ -f ".env.${{ env.CONTOUR }}" ]; then
              cp ".env.${{ env.CONTOUR }}" .env
            else
              echo "Warning: .env.${{ env.CONTOUR }} not found in $service"
            fi
            go mod vendor
            cd ..
          done

      - name: Build Docker images
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cd trip-builder/services

          # Собираем только те сервисы, у которых есть Dockerfile
          for service in */ ; do
            service=${service%/}
            if [ -f "$service/Dockerfile" ]; then
              echo "Building $service..."
              docker build \
                -t ${REPO_LOWER}/$service:${{ github.sha }} \
                -f $service/Dockerfile \
                $service
            else
              echo "⚠️  Skipping $service: Dockerfile not found"
            fi
          done

      - name: Save images to tar
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p images
          cd trip-builder
          for service in $(echo '${{ steps.services.outputs.services }}' | jq -r '.[]'); do
            docker save ${REPO_LOWER}/$service:${{ github.sha }} | gzip > ../images/$service.tar.gz
          done

      - name: Copy nginx config and service dirs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            .docker/${{ env.NGINX_CONF_SOURCE }}
            trip-builder/services/
          target: /tmp
          strip_components: 0

      - name: Copy images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images/*.tar.gz"
          target: "/tmp"

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Создаём рабочую директорию
            sudo mkdir -p ${{ env.REMOTE_PATH }}
            sudo chown $USER:$USER ${{ env.REMOTE_PATH }}

            # Копируем папки сервисов (уже с .env файлами)
            cp -r /tmp/trip-builder/services ${{ env.REMOTE_PATH }}/

            # Устанавливаем nginx конфиг
            sudo mv /tmp/.docker/${{ env.NGINX_CONF_SOURCE }} ${{ env.NGINX_CONF_TARGET }}
            sudo ln -sf ${{ env.NGINX_CONF_TARGET }} /etc/nginx/apps-enabled/$(basename ${{ env.NGINX_CONF_TARGET }})

            # Загружаем образы
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            cd /tmp/images
            for img in *.tar.gz; do
              gunzip -c "$img" | docker load
            done
            rm -rf /tmp/images

            # Тут разработчик сам запускает docker-compose (мы его не трогаем)
            echo "Images loaded. Developer should run docker-compose manually with correct .env files."

            # Перезагружаем nginx
            sudo nginx -t && sudo systemctl reload nginx