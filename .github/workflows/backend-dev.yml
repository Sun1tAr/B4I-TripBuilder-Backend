name: Backend Dev CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - develop

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  DEPLOY_PATH: /opt/trip-builder/dev
  NGINX_APPS_AVAILABLE: /etc/nginx/apps-available/trip-builder-backend-dev.conf
  NGINX_APPS_ENABLED: /etc/nginx/apps-enabled/trip-builder-backend-dev.conf
  CONTOUR: development

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Только сервисы с реальным кодом (auth и user)
      - name: Create vendor for Auth
        working-directory: ./trip-builder/services/auth
        run: |
          go mod download
          go mod vendor

      - name: Create vendor for User
        working-directory: ./trip-builder/services/user
        run: |
          go mod download
          go mod vendor

      - name: Run tests (Auth service)
        working-directory: ./trip-builder/services/auth
        run: go test ./... -v
        continue-on-error: true

      - name: Run tests (User service)
        working-directory: ./trip-builder/services/user
        run: go test ./... -v
        continue-on-error: true

      - name: Build Auth service
        working-directory: ./trip-builder/services/auth
        run: go build -v -o bin/auth ./cmd/server

      - name: Build User service
        working-directory: ./trip-builder/services/user
        run: go build -v -o bin/user ./cmd/server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            trip-builder/services/auth/bin/auth
            trip-builder/services/user/bin/user
          retention-days: 1

  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase variables
        id: string
        run: |
          echo "lowercase_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          echo "lowercase_repo=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Подготовка env файлов для dev контура
      - name: Prepare env files for dev
        run: |
          cd trip-builder/services
          for service in auth user; do
            if [ -f "$service/.env.${{ env.CONTOUR }}" ]; then
              cp "$service/.env.${{ env.CONTOUR }}" "$service/.env"
              echo "✅ Prepared .env for $service"
            fi
          done

      - name: Create vendor for Auth (for Docker)
        working-directory: ./trip-builder/services/auth
        run: |
          go mod download
          go mod vendor

      - name: Create vendor for User (for Docker)
        working-directory: ./trip-builder/services/user
        run: |
          go mod download
          go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Auth Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-builder/services/auth
          file: ./trip-builder/services/auth/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/auth:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/auth:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push User Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-builder/services/user
          file: ./trip-builder/services/user/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/user:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/user:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set lowercase variables
        id: string
        run: |
          echo "lowercase_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          echo "lowercase_repo=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_HOST }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directory on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}"

      # Копируем docker-compose.yml (он общий для всех)
      - name: Copy docker-compose.yml to server
        run: |
          scp trip-builder/docker-compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml

      # Копируем папки сервисов с их .env файлами
      - name: Copy service directories to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}/services"
          scp -r trip-builder/services/auth ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/services/
          scp -r trip-builder/services/user ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/services/

      - name: Create .env file on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cat > ${{ env.DEPLOY_PATH }}/.env << 'EOF'
          # Общие переменные для docker-compose
          AUTH_IMAGE=${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/auth:${{ github.sha }}
          USER_IMAGE=${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase_owner }}/${{ steps.string.outputs.lowercase_repo }}/user:${{ github.sha }}
          CONTOUR=${{ env.CONTOUR }}
          EOF"

      - name: Deploy on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}
          
            # Login to GitHub Container Registry
            echo "Logging in to GHCR..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
            # Pull latest images
            echo "Pulling latest images..."
            docker-compose pull
          
            # Stop and remove old containers
            echo "Stopping old containers..."
            docker-compose down --remove-orphans || true
          
            # Start new containers
            echo "Starting new containers..."
            docker-compose up -d
          
            # Clean up old images
            echo "Cleaning up old images..."
            docker image prune -f
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          echo "✅ Deployment completed"
          # Здесь можно добавить health check, когда будут готовы эндпоинты

  configure-nginx:
    name: Configure Nginx
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event.pull_request.merged == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_HOST }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy nginx config to server
        run: |
          scp .docker/nginx-backend-dev.conf ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.NGINX_APPS_AVAILABLE }}

      - name: Enable nginx config and reload
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
          
            # Create symlink if not exists
            if [ ! -L ${{ env.NGINX_APPS_ENABLED }} ]; then
              sudo ln -s ${{ env.NGINX_APPS_AVAILABLE }} ${{ env.NGINX_APPS_ENABLED }}
              echo "Created symlink for nginx config"
            fi
          
            # Test nginx configuration
            echo "Testing nginx configuration..."
            sudo nginx -t
          
            # Reload nginx if test passed
            echo "Reloading nginx..."
            sudo systemctl reload nginx || sudo systemctl restart nginx
          
            echo "Nginx configuration applied successfully"
          EOF