name: Backend Dev CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: read
  packages: write


jobs:
  # Сначала вычисляем время
  prepare:
    name: Prepare workflow data
    runs-on: ubuntu-latest
    outputs:
      workflow_start: ${{ steps.time.outputs.workflow_start }}
    steps:
      - name: Get workflow start time
        id: time
        run: |
          WORKFLOW_START=$(date -u +'%Y.%m.%d.%H.%M')
          echo "workflow_start=$WORKFLOW_START" >> $GITHUB_OUTPUT
          echo "Workflow started at: $WORKFLOW_START"

  call-build-deploy:
    needs: prepare
    uses: ./.github/workflows/backend-build-deploy.yml
    with:
      contour: development
      deploy_path: /opt/trip-builder/dev
      nginx_conf_source: .docker/nginx-backend-dev.conf
      nginx_conf_target: /etc/nginx/apps-available/trip-builder-backend-dev.conf

      # Передаём вычисленное время
      workflow_start: ${{ needs.prepare.outputs.workflow_start || 'default_value'  }}

      # jDoc сервисы
      services: '["auth", "user", "gateway", "route", "event", "task", "chat", "media", "notification"]'

      auth_port: 9101
      auth_container_name: trip-builder-backend-auth-dev

      user_port: 9102
      user_container_name: trip-builder-backend-user-dev

      gateway_port: 9110
      gateway_ws_port: 9111
      gateway_container_name: trip-builder-backend-gateway-dev

      postgres_port: 5422
      postgres_container_name: postgres-dev
      postgres_user: auth_user
      postgres_password: auth_pass_dev
      postgres_database_name: trip-builder

      redis_port: 6369
      redis_container_name: redis-dev

      zookeeper_container_name: zookeeper-dev
      zookeeper_port: 2171
      kafka_container_name: kafka-dev
      kafka_port: 9082

      # jDoc топики кафки
      kafka_topics: '[
        "user.created", 
        "user.updated", 
        "user.deleted", 
        "route.created", 
        "event.completed", 
        "event.deleted",
        "media.uploaded", 
        "user.events.retry", 
        "user.events.dlq", 
        "user.achievement_earned", 
        "route.updated", 
        "route.deleted",
        "event.created", 
        "event.updated", 
        "event.completed", 
        "event.cancelled", 
        "waypoint.visited", 
        "task.completed",
        "event.participant_joined",
        "event.invite",
        "task.assigned"
        ]'

      route_port: 9103
      route_container_name: trip-builder-backend-route-dev

      event_port: 9104
      event_container_name: trip-builder-backend-event-dev

      task_port: 9105
      task_container_name: trip-builder-backend-task-dev

      chat_port: 9106
      chat_container_name: trip-builder-backend-chat-dev

      media_port: 9107
      media_container_name: trip-builder-backend-media-dev

      notification_port: 9109
      notification_container_name: trip-builder-backend-media-dev

      minio_port: 7100
      minio_console_port: 7101
      minio_container_name: minio-dev
      minio_user: minio_user
      minio_password: minio_pass_dev

    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}