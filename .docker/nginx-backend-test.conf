server {
    listen 80;
    server_name monitoring.trip-builder.ru data.trip-builder.ru;
    return 301 https://$server_name$request_uri;  # редирект с HTTP на HTTPS
}


server {
    listen 443 ssl http2;
    server_name monitoring.trip-builder.ru;

    ssl_certificate /etc/letsencrypt/live/monitoring.trip-builder.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.trip-builder.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

