# Dev контур: порты 9101–9110
# Префикс для всех upstream сервисов — /api/v1 (как ожидают сервисы)

location /trip-builder-api/v1/ {
    # Общие настройки прокси
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Gateway — обрабатывает корень /api/v1/ и всё, что не попало под другие локации
    location /trip-builder-api/v1/ {
        rewrite ^/trip-builder-api/v1/(.*) /api/v1/$1 break;
        proxy_pass http://127.0.0.1:9010;
    }
}