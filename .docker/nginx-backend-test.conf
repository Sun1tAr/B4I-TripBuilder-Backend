# Test контур: порты 9001–9010
# Префикс для всех upstream сервисов — /api/v1

location /trip-builder/api/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Auth
    location /trip-builder/api/v1/auth/ {
        rewrite ^/trip-builder/api/v1/auth/(.*) /api/v1/auth/$1 break;
        proxy_pass http://127.0.0.1:9001;
    }

    # Users
    location /trip-builder/api/v1/users/ {
        rewrite ^/trip-builder/api/v1/users/(.*) /api/v1/users/$1 break;
        proxy_pass http://127.0.0.1:9002;
    }

    # Routes
    location /trip-builder/api/v1/routes/ {
        rewrite ^/trip-builder/api/v1/routes/(.*) /api/v1/routes/$1 break;
        proxy_pass http://127.0.0.1:9003;
    }

    # Events
    location /trip-builder/api/v1/events/ {
        rewrite ^/trip-builder/api/v1/events/(.*) /api/v1/events/$1 break;
        proxy_pass http://127.0.0.1:9004;
    }

    # Tasks
    location /trip-builder/api/v1/tasks/ {
        rewrite ^/trip-builder/api/v1/tasks/(.*) /api/v1/tasks/$1 break;
        proxy_pass http://127.0.0.1:9005;
    }

    # Chat
    location /trip-builder/api/v1/chat/ {
        rewrite ^/trip-builder/api/v1/chat/(.*) /api/v1/chat/$1 break;
        proxy_pass http://127.0.0.1:9006;
    }

    # Media
    location /trip-builder/api/v1/media/ {
        rewrite ^/trip-builder/api/v1/media/(.*) /api/v1/media/$1 break;
        proxy_pass http://127.0.0.1:9007;
    }

    # Search
    location /trip-builder/api/v1/search/ {
        rewrite ^/trip-builder/api/v1/search/(.*) /api/v1/search/$1 break;
        proxy_pass http://127.0.0.1:9008;
    }

    # Notifications
    location /trip-builder/api/v1/notifications/ {
        rewrite ^/trip-builder/api/v1/notifications/(.*) /api/v1/notifications/$1 break;
        proxy_pass http://127.0.0.1:9009;
    }

    # Gateway — обрабатывает корень /api/v1/
    location /trip-builder/api/v1/ {
        rewrite ^/trip-builder/api/v1/(.*) /api/v1/$1 break;
        proxy_pass http://127.0.0.1:9010;
    }
}