# Dev контур: порты 9101–9110
# Префикс для всех upstream сервисов — /api/v1 (как ожидают сервисы)

location /trip-builder/dev/api/v1/ {
    # Общие настройки прокси
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Auth — ожидает /api/v1/auth
    location /trip-builder/dev/api/v1/auth/ {
        rewrite ^/trip-builder/dev/api/v1/auth/(.*) /api/v1/auth/$1 break;
        proxy_pass http://127.0.0.1:9101;
    }

    # Users — ожидает /api/v1/users
    location /trip-builder/dev/api/v1/users/ {
        rewrite ^/trip-builder/dev/api/v1/users/(.*) /api/v1/users/$1 break;
        proxy_pass http://127.0.0.1:9102;
    }

    # Routes — ожидает /api/v1/routes
    location /trip-builder/dev/api/v1/routes/ {
        rewrite ^/trip-builder/dev/api/v1/routes/(.*) /api/v1/routes/$1 break;
        proxy_pass http://127.0.0.1:9103;
    }

    # Events — ожидает /api/v1/events
    location /trip-builder/dev/api/v1/events/ {
        rewrite ^/trip-builder/dev/api/v1/events/(.*) /api/v1/events/$1 break;
        proxy_pass http://127.0.0.1:9104;
    }

    # Tasks — ожидает /api/v1/tasks
    location /trip-builder/dev/api/v1/tasks/ {
        rewrite ^/trip-builder/dev/api/v1/tasks/(.*) /api/v1/tasks/$1 break;
        proxy_pass http://127.0.0.1:9105;
    }

    # Chat — ожидает /api/v1/chat
    location /trip-builder/dev/api/v1/chat/ {
        rewrite ^/trip-builder/dev/api/v1/chat/(.*) /api/v1/chat/$1 break;
        proxy_pass http://127.0.0.1:9106;
    }

    # Media — ожидает /api/v1/media
    location /trip-builder/dev/api/v1/media/ {
        rewrite ^/trip-builder/dev/api/v1/media/(.*) /api/v1/media/$1 break;
        proxy_pass http://127.0.0.1:9107;
    }

    # Search — ожидает /api/v1/search
    location /trip-builder/dev/api/v1/search/ {
        rewrite ^/trip-builder/dev/api/v1/search/(.*) /api/v1/search/$1 break;
        proxy_pass http://127.0.0.1:9108;
    }

    # Notifications — ожидает /api/v1/notifications
    location /trip-builder/dev/api/v1/notifications/ {
        rewrite ^/trip-builder/dev/api/v1/notifications/(.*) /api/v1/notifications/$1 break;
        proxy_pass http://127.0.0.1:9109;
    }

    # Gateway — обрабатывает корень /api/v1/ и всё, что не попало под другие локации
    location /trip-builder/dev/api/v1/ {
        rewrite ^/trip-builder/dev/api/v1/(.*) /api/v1/$1 break;
        proxy_pass http://127.0.0.1:9110;
    }
}